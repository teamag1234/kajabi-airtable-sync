const NIVELES = ['A1', 'A2', 'B1', 'B2', 'C1'];

/**
 * Porcentaje de aciertos → nivel. El 100% es B2 (el test no llega a medir C1).
 * El umbral es el mínimo de aciertos (%) para tener ese nivel.
 */
const UMBRALES = [
  { nivel: 'B2', desde: 85 },
  { nivel: 'B1', desde: 55 },
  { nivel: 'A2', desde: 30 },
  { nivel: 'A1', desde: 0 },
];

function nivelDesdePorcentaje(porcentaje) {
  return UMBRALES.find((u) => porcentaje >= u.desde).nivel;
}

/**
 * Corrige las respuestas (array de índices, una por pregunta, null si falta).
 * Devuelve aciertos, nota sobre 10, porcentaje, nivel y aciertos por sección.
 */
function corregir(respuestas = []) {
  const porSeccion = {};
  let aciertos = 0;
  PREGUNTAS.forEach((p, i) => {
    const s = (porSeccion[p.seccion] ||= { aciertos: 0, total: 0 });
    s.total += 1;
    if (respuestas[i] === p.correcta) {
      s.aciertos += 1;
      aciertos += 1;
    }
  });
  const total = PREGUNTAS.length;
  const porcentaje = Math.round((aciertos / total) * 100);
  return {
    aciertos,
    total,
    porcentaje,
    nota: Math.round((aciertos / total) * 100) / 10,
    nivel: nivelDesdePorcentaje(porcentaje),
    porSeccion,
  };
}

const OBJETIVO = { A2: 1, B1: 2, B2: 3, C1: 4, 'no-se': 2 };

/**
 * Elige el curso según el nivel actual, el que le piden y el tiempo que tiene.
 * Level solo llega a B1; para B2/C1 siempre es Directo. Cuanto más salto de
 * nivel y menos tiempo, más acompañamiento (Tutorizado).
 */
function recomendarCurso({ necesita, cuando } = {}, nivel) {
  const actual = NIVELES.indexOf(nivel);
  const objetivo = OBJETIVO[necesita] ?? 2;
  const nivelObjetivo = NIVELES[objetivo];
  const salto = objetivo - actual;
  const prisa = cuando === 'menos-1-mes';
  const pocoTiempo = prisa || cuando === '1-3-meses';
  const plazo = prisa ? 'en menos de un mes' : pocoTiempo ? 'en pocos meses' : 'a tu ritmo';

  let curso;
  let motivo;
  if (salto <= 0) {
    curso = objetivo >= 3 ? 'express' : 'level';
    motivo = `Ya tienes el ${nivelObjetivo}. Lo que te falta es conocer el examen por dentro y no dejar puntos por el camino.`;
  } else if (objetivo >= 3) {
    curso = salto >= 2 || prisa ? 'tutorizado' : 'express';
    motivo = curso === 'tutorizado'
      ? `Pasar de ${nivel} a ${nivelObjetivo} ${plazo} se hace mucho más fácil con alguien que te corrija y te diga qué te falta.`
      : `Para el ${nivelObjetivo} necesitas el método completo, del nivel que tienes hasta el que te piden.`;
  } else if (salto === 1) {
    curso = prisa ? 'express' : 'level';
    motivo = prisa
      ? `Te separa un nivel del ${nivelObjetivo} y vas con el tiempo justo: necesitas ir directo a lo que puntúa.`
      : `Te separa un solo nivel del ${nivelObjetivo}. Con 3 meses de método bien organizado llegas.`;
  } else {
    curso = pocoTiempo ? 'tutorizado' : 'express';
    motivo = pocoTiempo
      ? `De ${nivel} a ${nivelObjetivo} ${plazo} se puede, pero no solo. Con tutor sabes cada semana dónde estás.`
      : `De ${nivel} a ${nivelObjetivo} hay camino, y con 6 meses y el método completo lo recorres sin agobios.`;
  }
  return { curso, motivo, nivelObjetivo, salto };
}

/**
 * Referencia corta del lead (p. ej. "TN4K9Z2Q") que viaja en el WhatsApp que
 * nos escribe desde el resultado. Sale del email, así el servidor y el
 * navegador calculan la misma sin guardarla en ningún sitio. Hash FNV-1a.
 */
function referenciaLead(email) {
  let h = 0x811c9dc5;
  for (const c of String(email || '').trim().toLowerCase()) {
    h ^= c.codePointAt(0);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return `TN${h.toString(36).toUpperCase().padStart(7, '0')}`;
}

    },

    speaking: function () {
      var l = leccionActual();
      var e = ej(l.id);
      var q = e.q || 0;
      var p = l.preguntas[q];
      var vistas = e.vistas || [];
      var grabar = puedeGrabar()
        ? '<button type="button" class="ag-demo-btn ag-demo-btn-ghost" data-accion="speaking-grabar">🎙️ Grabarme mientras respondo</button>'
        : '';
      return cabecera(l) +
        '<p class="ag-demo-tip"><b>Estructura:</b> ' + esc(l.estructura) + '</p>' +
        '<div class="ag-demo-speak"><p class="ag-demo-kicker">Pregunta ' + (q + 1) + ' de ' + l.preguntas.length + '</p>' +
        '<p class="ag-demo-speak-q">' + esc(p.pregunta) + '</p>' +
        '<div class="ag-demo-timer" id="ag-demo-timer">' + l.segundos + '</div>' +
        '<div id="ag-demo-speak-acciones"><button type="button" class="ag-demo-btn" data-accion="speaking-empezar">Responder (' + l.segundos + ' s)</button>' + grabar + '</div>' +
        '<div id="ag-demo-audio">' + (speak.url && speak.urlQ === q ? '<p class="ag-demo-small">Tu respuesta:</p><audio controls src="' + speak.url + '"></audio>' : '') + '</div>' +
        (vistas.indexOf(q) !== -1
          ? '<div class="ag-demo-model"><b>Respuesta modelo:</b> ' + esc(p.modelo) + '</div>'
          : '<button type="button" class="ag-demo-link" data-accion="speaking-modelo">Ver respuesta modelo</button>') +
        '</div>' +
        '<div class="ag-demo-dots">' + l.preguntas.map(function (_, k) {
          return '<button type="button" class="ag-demo-dotq' + (k === q ? ' ag-demo-on' : '') + (vistas.indexOf(k) !== -1 ? ' ag-demo-done' : '') + '" data-accion="speaking-ir" data-k="' + k + '" aria-label="Pregunta ' + (k + 1) + '">' + (k + 1) + '</button>';
        }).join('') + '</div>' +
        pie(l, vistas.length > 0);
    },

    registro: function () {
      var l = leccionActual();
      return '<div class="ag-demo-gate"><div class="ag-demo-check">🔑</div>' +
        '<h2 class="ag-demo-h2">Desbloquea el resto del aula</h2>' +
        '<p class="ag-demo-lead">Te quedan ' + (DEMO_LECCIONES.length - CONFIG.leccionesLibres) + ' lecciones: Reading, Writing y Speaking. Déjanos tus datos y entras ahora mismo. Así también guardamos tu progreso.</p>' +
        '<form class="ag-demo-form" data-accion="registro" novalidate>' +
        '<label class="ag-demo-label" for="ag-demo-nombre">Nombre</label>' +
        '<input id="ag-demo-nombre" class="ag-demo-input" name="nombre" autocomplete="given-name" required maxlength="60" placeholder="Tu nombre" value="' + esc(estado.nombre) + '" autofocus>' +
        '<label class="ag-demo-label" for="ag-demo-email">Email</label>' +
        '<input id="ag-demo-email" class="ag-demo-input" type="email" name="email" autocomplete="email" required maxlength="120" placeholder="tu@email.com">' +
        '<label class="ag-demo-label" for="ag-demo-tel">WhatsApp</label>' +
        '<input id="ag-demo-tel" class="ag-demo-input" type="tel" name="telefono" autocomplete="tel" required maxlength="20" placeholder="600 000 000">' +
        '<label class="ag-demo-consent"><input type="checkbox" name="acepto" required> <span>Acepto la <a href="' + CONFIG.privacidad + '" target="_blank" rel="noopener">política de privacidad</a> y que AG Academy me escriba sobre el curso.</span></label>' +
        '<p class="ag-demo-error" hidden></p>' +
        '<button class="ag-demo-btn" type="submit">Desbloquear: ' + esc(l.titulo) + ' →</button></form></div>';
    },

    fin: function () {
      var saludo = estado.nombre ? primerNombre() + ', ' : '';
      var todas = estado.hechas.length === DEMO_LECCIONES.length;
      var cursos = Object.keys(CURSOS_TEST).map(function (k) {
        var c = CURSOS_TEST[k];
        return '<div class="ag-demo-course' + (k === 'express' ? ' ag-demo-course-top' : '') + '">' +
          (k === 'express' ? '<span class="ag-demo-course-tag">El más elegido</span>' : '') +
          '<h3>' + esc(c.nombre) + '</h3><p class="ag-demo-course-sub">' + esc(c.subtitulo) + '</p>' +
          '<ul class="ag-demo-list">' + c.incluye.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
          '<p class="ag-demo-course-price">' + euros(c.precio) + '<small>o 3 cuotas sin intereses con Klarna</small></p>' +
          '<a class="ag-demo-btn' + (k === 'express' ? '' : ' ag-demo-btn-ghost') + '" data-accion="comprar" data-curso="' + k + '" href="' + urlCheckout(k) + '">Empezar con este →</a></div>';
      }).join('');
      return '<div class="ag-demo-center"><div class="ag-demo-check">' + (todas ? '✓' : '★') + '</div>' +
        '<h2 class="ag-demo-h2">' + (todas ? saludo + 'has hecho la demo entera' : saludo + 'esto es lo que te espera dentro') + '</h2>' +
        '<p class="ag-demo-lead">Lo que acabas de probar es como se trabaja cada parte del curso: explicación corta, ejercicio tipo examen y el truco para no fallarlo. Dentro tienes el resto de partes, simulacros y clases en directo.</p></div>' +
        '<div class="ag-demo-courses">' + cursos + '</div>' +
        '<p class="ag-demo-guarantee"><span>🛡️</span> <span><b>15 días de prueba.</b> Entra, mira las clases, prueba el método. Si no te convence, te devolvemos el dinero. Sin preguntas.</span></p>' +
        '<div class="ag-demo-help"><p><b>¿No sabes cuál te encaja?</b> Escríbenos y te lo decimos en 2 minutos, o haz el <a href="' + CONFIG.testNivel + '">test de nivel gratis</a> y te lo recomienda él.</p>' +
        '<a class="ag-demo-btn ag-demo-btn-wa" data-accion="whatsapp" href="' + urlWhatsApp() + '" target="_blank" rel="noopener">Tengo dudas, os escribo por WhatsApp</a></div>';
    }
  };

  function urlCheckout(key) {
    return CURSOS_TEST[key].url + '?utm_source=demo-curso&utm_medium=web&utm_campaign=demo-curso&utm_content=' + key;
  }

  function urlWhatsApp() {
    var nombre = (estado.nombre || '').trim().split(/\s+/)[0];
    var texto = 'Hola!' + (nombre ? ' Soy ' + nombre + '.' : '') + ' He probado la demo del curso en la web y tengo unas dudas antes de apuntarme 🙂';
    return 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(texto);
  }

  function resaltarPlantilla(l) {
    var html = esc(l.modelo);
    l.plantilla.forEach(function (p) {
      p.frase.split(/\s*(?:\/|…)\s*/).forEach(function (trozo) {
        var t = esc(trozo.replace(/[,.]+$/, '').trim());
        if (t.length > 4) html = html.split(t).join('<mark>' + t + '</mark>');
      });
    });
    return html.replace(/\n/g, '<br>');
  }

  function mezclar(arr) {
    var a = arr.slice();
    do {
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    } while (a.every(function (x, k) { return x === k; }));
    return a;
  }

  function contarWriting() {
    var area = root.querySelector('.ag-demo-textarea');
    var el = document.getElementById('ag-demo-count');
    if (!area || !el) return;
    var l = leccionActual();
    var n = contarPalabras(area.value);
    var ok = n >= l.minimo && n <= l.maximo;
    el.textContent = n + ' palabras · objetivo ' + l.minimo + '-' + l.maximo;
    el.className = 'ag-demo-count' + (ok ? ' ag-demo-count-ok' : '');
  }

  // ─── SPEAKING: cuenta atrás y grabación (nada sale del navegador) ────────
  var speak = { intervalo: null, rec: null, stream: null, trozos: [], url: null, urlQ: null };
  function puedeGrabar() { return Boolean(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }

  function pararSpeaking() {
    clearInterval(speak.intervalo);
    speak.intervalo = null;
    if (speak.rec && speak.rec.state !== 'inactive') { speak.rec.onstop = null; speak.rec.stop(); }
    if (speak.stream) speak.stream.getTracks().forEach(function (t) { t.stop(); });
    speak.rec = null;
    speak.stream = null;
  }

  function cuentaAtras(conGrabacion) {
    var l = leccionActual();
    var restante = l.segundos;
    var timer = document.getElementById('ag-demo-timer');
    var acciones = document.getElementById('ag-demo-speak-acciones');
    if (acciones) acciones.innerHTML = '<button type="button" class="ag-demo-link" data-accion="speaking-parar">He terminado</button>';
    if (timer) { timer.textContent = restante; timer.classList.add('ag-demo-timer-on'); }
    track('demo_curso_speaking', { grabando: conGrabacion });
    speak.intervalo = setInterval(function () {
      restante -= 1;
      if (timer) timer.textContent = Math.max(restante, 0);
      if (restante <= 0) terminarRespuesta();
    }, 1000);
  }

  function terminarRespuesta() {
    clearInterval(speak.intervalo);
    speak.intervalo = null;
    var l = leccionActual();
    var e = ej(l.id);
    e.vistas = e.vistas || [];
    if (e.vistas.indexOf(e.q || 0) === -1) e.vistas.push(e.q || 0);
    guardar();
    if (speak.rec && speak.rec.state !== 'inactive') {
      speak.rec.onstop = function () {
        if (speak.stream) speak.stream.getTracks().forEach(function (t) { t.stop(); });
        var blob = new Blob(speak.trozos, { type: speak.rec.mimeType || 'audio/webm' });
        if (speak.url) URL.revokeObjectURL(speak.url);
        speak.url = URL.createObjectURL(blob);
        speak.urlQ = e.q || 0;
        speak.rec = null;
        speak.stream = null;
        pintar(true);
      };
      speak.rec.stop();
    } else {
      pintar(true);
    }
  }

  function grabarYEmpezar() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      speak.stream = stream;
      speak.trozos = [];
      speak.rec = new MediaRecorder(stream);
      speak.rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) speak.trozos.push(ev.data); };
      speak.rec.start();
      cuentaAtras(true);
    }).catch(function () {
      // Sin permiso de micro: responde igual, sin grabar.
      cuentaAtras(false);
    });
  }

  // ─── NAVEGACIÓN ───────────────────────────────────────────────────────────
  function abrir(id) {
    var l = leccionDemo(id);
    if (!l) return;
    estado.leccion = id;
    estado.vista = requiereRegistro(id) ? 'registro' : l.tipo;
    if (estado.vista === 'registro') track('demo_curso_registro_visto', { leccion: id });
    guardar();
    pintar();
  }

  function completar() {
    var l = leccionActual();
    if (!hecha(l.id)) {
      estado.hechas.push(l.id);
      track('demo_curso_leccion', { leccion: l.id, numero: indice(l.id) + 1 });
      if (registrado()) enviar({ evento: 'progreso', email: estado.email, hechas: estado.hechas, leccion: l.id });
      if (estado.hechas.length === DEMO_LECCIONES.length) track('demo_curso_completada');
    }
    var sig = DEMO_LECCIONES[indice(l.id) + 1];
    if (sig) { abrir(sig.id); return; }
    estado.vista = 'fin';
    guardar();
    pintar();
  }

  function registrar(form) {
    var nombre = form.nombre.value.trim();
    var email = form.email.value.trim();
    var tel = form.telefono.value.replace(/[^\d+]/g, '');
    var error = form.querySelector('.ag-demo-error');
    var msg = !nombre ? '¿Cómo te llamas?'
      : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? 'Revisa el email, parece que falta algo.'
      : tel.replace(/\D/g, '').length < 9 ? 'Pon tu número de WhatsApp (9 cifras).'
      : !form.acepto.checked ? 'Necesitamos que aceptes la política de privacidad para darte acceso.' : '';
    if (msg) { error.textContent = msg; error.hidden = false; return; }

    estado.nombre = nombre;
    estado.email = email;
    estado.telefono = tel;
    enviar({
      evento: 'alta', nombre: nombre, email: email, telefono: tel,
      hechas: estado.hechas, leccion: estado.leccion, atribucion: estado.atribucion
    });
    track('demo_curso_lead', { lecciones_hechas: estado.hechas.length });
    try { if (window.fbq) window.fbq('track', 'Lead', { content_name: 'Demo curso' }); } catch (e) {}
    abrir(estado.leccion);
  }

  root.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.getAttribute('data-accion') === 'registro') registrar(ev.target);
  });

  root.addEventListener('input', function (ev) {
    if (ev.target.getAttribute('data-accion') !== 'writing') return;
    ej(estado.leccion).texto = ev.target.value;
    guardar();
    contarWriting();
  });

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-accion]');
    if (!el || el.tagName === 'FORM' || el.tagName === 'TEXTAREA' || el.disabled) return;
    var accion = el.getAttribute('data-accion');
    var l = leccionActual();
    var e = ej(l.id);

    if (accion === 'comprar') {
      var curso = el.getAttribute('data-curso');
      if (registrado()) enviar({ evento: 'clic', email: estado.email, curso: curso });
      track('demo_curso_oferta_click', { curso: curso });
      return; // el enlace sigue su curso
    }
    if (accion === 'whatsapp') {
      if (registrado()) enviar({ evento: 'whatsapp', email: estado.email });
      track('demo_curso_whatsapp');
      return; // el enlace abre WhatsApp
    }
    if (accion === 'empezar') {
      if (!estado.hechas.length) track('demo_curso_inicio');
      abrir(estado.leccion);
      return;
    }
    if (accion === 'ir') { abrir(el.getAttribute('data-id')); return; }
    if (accion === 'fin') { estado.vista = 'fin'; guardar(); pintar(); return; }
    if (accion === 'completar') { completar(); return; }

    if (accion === 'test') {
      e.r = e.r || [];
      e.r[Number(el.getAttribute('data-q'))] = Number(el.getAttribute('data-k'));
    } else if (accion === 'ordenar') {
      e.orden = (e.orden || []).concat(Number(el.getAttribute('data-k')));
    } else if (accion === 'ordenar-deshacer') {
      e.orden = (e.orden || []).slice(0, -1);
    } else if (accion === 'ordenar-corregir') {
      e.corregido = true;
    } else if (accion === 'ordenar-reiniciar') {
      e.orden = [];
      e.corregido = false;
    } else if (accion === 'writing-modelo') {
      e.modelo = true;
    } else if (accion === 'speaking-modelo') {
      e.vistas = (e.vistas || []).concat(e.q || 0);
    } else if (accion === 'speaking-ir') {
      e.q = Number(el.getAttribute('data-k'));
    } else if (accion === 'speaking-empezar') {
      cuentaAtras(false);
      return;
    } else if (accion === 'speaking-grabar') {
      grabarYEmpezar();
      return;
    } else if (accion === 'speaking-parar') {
      terminarRespuesta();
      return;
    } else {
      return;
    }
    guardar();
    pintar(true);
  });

  // Si guardó una vista que ya no existe (cambio de temario), vuelve a la portada.
  if (estado.vista !== 'portada' && !VISTAS[estado.vista]) estado.vista = 'portada';
  if (!leccionDemo(estado.leccion)) estado.leccion = DEMO_LECCIONES[0].id;
  estado.hechas = estado.hechas.filter(function (id) { return leccionDemo(id); });
  pintar(true);
})();
</script>
